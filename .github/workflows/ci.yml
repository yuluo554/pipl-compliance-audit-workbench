name: CI

on:
  push:
  pull_request:

# 全局 UTF-8：Windows 运行器默认 locale 为 cp1252，而本仓库的源码、数据与 CLI 输出
# 均含中文——不强制 UTF-8 会同时打挂「stdout 打印中文」与「按 locale 解码子进程输出」
# 两条通路（本地 zh-CN 环境恰好看不出来，故只在 CI 首跑暴露）。
env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  test:
    name: test (${{ matrix.os }} / py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            python-version: "3.8"
          - os: windows-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.12"
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Upgrade pip
        run: python -m pip install -U pip
      - name: Install package with dev + report extras
        run: python -m pip install -e ".[dev,report]"
      - name: Run full test suite
        run: python -m pytest -q
      - name: Run built-in benchmark (authoritative ruleset)
        run: python -m paudit bench
      - name: Run built-in benchmark (demo ruleset)
        run: python -m paudit bench --ruleset data/samples/ruleset-pipl-audit-demo.json
