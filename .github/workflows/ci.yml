name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }} / py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            python-version: "3.8"
          - os: windows-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.12"
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Upgrade pip
        run: python -m pip install -U pip
      - name: Install package with dev extras
        run: python -m pip install -e ".[dev]"
      - name: Run full test suite
        run: python -m pytest -q
      - name: Run built-in benchmark (demo ruleset)
        run: python -m paudit bench --ruleset data/samples/ruleset-pipl-audit-demo.json
