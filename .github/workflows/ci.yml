name: CI

on:
  push:
  pull_request:

# 全局 UTF-8：Windows 运行器默认 locale 为 cp1252，而本仓库的源码、数据与 CLI 输出
# 均含中文——不强制 UTF-8 会同时打挂「stdout 打印中文」与「按 locale 解码子进程输出」
# 两条通路（本地 zh-CN 环境恰好看不出来，故只在 CI 首跑暴露）。
env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  test:
    name: test (${{ matrix.os }} / py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.12"
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Upgrade pip
        run: python -m pip install -U pip
      - name: Install package with dev + report extras
        run: python -m pip install -e ".[dev,report]"
      # 收集数对账：无 gui 时 test_gui_smoke 模块级 importorskip → 3 项不收集。
      # 数字变动必须显式改这里（防止"少跑了却仍然绿"）。
      - name: Assert collected test count (no gui -> 232)
        shell: bash
        run: |
          count=$(python -m pytest tests --collect-only | sed -n 's/^\([0-9][0-9]*\) tests collected.*/\1/p' | tail -1)
          echo "collected=$count (expected 232)"
          test "$count" = "232"
      - name: Run full test suite
        run: python -m pytest -q
      - name: Run built-in benchmark (authoritative ruleset)
        run: python -m paudit bench
      - name: Run built-in benchmark (demo ruleset)
        run: python -m paudit bench --ruleset data/samples/ruleset-pipl-audit-demo.json

  gui-smoke:
    name: gui-smoke (windows-latest / py3.12)
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Upgrade pip
        run: python -m pip install -U pip
      - name: Install package with dev + gui + report extras
        run: python -m pip install -e ".[dev,gui,report]"
      # 装了 gui → 3 项 GUI 冒烟真实收集（== 全量收集数）。
      - name: Assert collected test count (gui -> 235)
        shell: bash
        run: |
          count=$(python -m pytest tests --collect-only | sed -n 's/^\([0-9][0-9]*\) tests collected.*/\1/p' | tail -1)
          echo "collected=$count (expected 235)"
          test "$count" = "235"
      - name: Run GUI smoke tests
        run: python -m pytest tests/test_gui_smoke.py -q
